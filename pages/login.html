<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FitLife</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="logo">
            <h1>FIT <span>LIFE</span></h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="exercicios.html">Exercícios</a></li>
                <li><a href="habitos.html">Hábitos</a></li>
                <li><a href="dicas.html">Dicas</a></li>
                <li><a href="metas.html">Metas</a></li>
                <li><a href="login.html" class="btn-login">Entrar</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo principal -->
    <main>
        <section class="login-area">
            <div class="login-box">
                <h2>Bem-vindo de volta</h2>
                <p>Faça login para acessar seu acompanhamento</p>
                
                <form>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail">
                    
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha">
                    
                    <button type="submit" class="btn-entrar">Entrar</button>
                </form>
                
                <p class="cadastro">Não tem conta? <a href="#">Cadastre-se</a></p>
            </div>
        </section>
    </main>

    <!-- Rodapé -->
    <footer>
        <p> FitLife - FIEB | ODS 3: Saúde e Bem-Estar</p>
    </footer>

</body>
</html>
